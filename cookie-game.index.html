<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Cookie Game</title>

    <style>
        @font-face {
            font-family: 'Bubble Games';
            src: url('BubbleGames.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        body {
            font-family: 'Bubble Games', sans-serif;
            text-align: center;
            background-color: #f7e7c6;
            margin-top: 50px;
        }

        h1 {
            color: #6b3e26;
        }

        #cookie {
            font-size: 150px;
            border: none;
            background: none;
            cursor: pointer;
            transition: transform 0.1s;
        }

        #cookie:active {
            transform: scale(0.9);
        }

        #count {
            font-size: 40px;
            font-weight: bold;
        }

        button.upgrade {
            padding: 12px 12px;
            font-size: 18px;
            cursor: pointer;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    
</body>
</html><!DOCTYPE html>
